<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect for text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />
  <rect width="1200" height="300" fill="url(#grid)" />

  <!-- Decorative circuit lines -->
  <g stroke="#00d26a" stroke-width="1.5" fill="none" opacity="0.15">
    <path d="M 0 80 L 200 80 L 250 130 L 400 130" />
    <path d="M 1200 220 L 1000 220 L 950 170 L 800 170" />
    <path d="M 100 0 L 100 100 L 150 150 L 150 300" />
    <path d="M 1100 0 L 1100 100 L 1050 150 L 1050 300" />
    <circle cx="200" cy="80" r="3" fill="#00d26a" stroke="none" opacity="0.4"/>
    <circle cx="400" cy="130" r="3" fill="#00d26a" stroke="none" opacity="0.4"/>
    <circle cx="1000" cy="220" r="3" fill="#00d26a" stroke="none" opacity="0.4"/>
    <circle cx="800" cy="170" r="3" fill="#00d26a" stroke="none" opacity="0.4"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#00d26a" opacity="0.8" />

  <!-- Terminal window decoration -->
  <g transform="translate(80, 60)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="500" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="500" height="28" rx="8" fill="#21262d" />
    <rect x="0" y="20" width="500" height="8" fill="#21262d" />

    <!-- Window buttons -->
    <circle cx="20" cy="14" r="5" fill="#ff5f56" />
    <circle cx="38" cy="14" r="5" fill="#ffbd2e" />
    <circle cx="56" cy="14" r="5" fill="#27c93f" />

    <!-- Terminal content -->
    <text x="20" y="55" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#7ee787">
      <tspan x="20" dy="0">$ whoami</tspan>
      <tspan x="20" dy="22" fill="#79c0ff">systems-engineer</tspan>
      <tspan x="20" dy="22" fill="#7ee787">$ cat /etc/os-release</tspan>
      <tspan x="20" dy="22" fill="#79c0ff">NAME="Engineering Workstation"</tspan>
      <tspan x="20" dy="22" fill="#79c0ff">FOCUS="Backend · Distributed Systems · DevOps"</tspan>
      <tspan x="20" dy="22" fill="#7ee787">$ echo $CURRENT_STATUS</tspan>
      <tspan x="20" dy="22" fill="#ffa657">Building resilient infrastructure &amp; scalable architecture</tspan>
    </text>
  </g>

  <!-- Right side: Large identity text -->
  <g transform="translate(640, 80)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="48" font-weight="700" fill="#f0f6fc" letter-spacing="-1">
      SYSTEMS
    </text>
    <text x="0" y="55" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="48" font-weight="700" fill="#00d26a" letter-spacing="-1" filter="url(#glow)">
      ENGINEER
    </text>
    <text x="0" y="95" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="16" fill="#8b949e" letter-spacing="2">
      BACKEND · DISTRIBUTED SYSTEMS · DEVOPS · CLOUD
    </text>

    <!-- Status indicators -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="140" height="32" rx="4" fill="#238636" opacity="0.15" stroke="#238636" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#3fb950" />
      <text x="32" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3fb950" font-weight="600">OPERATIONAL</text>

      <rect x="160" y="0" width="140" height="32" rx="4" fill="#1f6feb" opacity="0.15" stroke="#1f6feb" stroke-width="1" />
      <text x="175" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#58a6ff" font-weight="600">CAIRO, EG</text>

      <rect x="320" y="0" width="140" height="32" rx="4" fill="#8957e5" opacity="0.15" stroke="#8957e5" stroke-width="1" />
      <text x="335" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a371f7" font-weight="600">OPEN TO WORK</text>
    </g>
  </g>

  <!-- Bottom decorative line -->
  <line x1="80" y1="270" x2="1120" y2="270" stroke="#30363d" stroke-width="1" />
  <line x1="80" y1="270" x2="300" y2="270" stroke="#00d26a" stroke-width="2" opacity="0.6" />

  <!-- Corner brackets -->
  <g stroke="#00d26a" stroke-width="2" fill="none" opacity="0.3">
    <path d="M 40 40 L 40 20 L 60 20" />
    <path d="M 1160 40 L 1160 20 L 1140 20" />
    <path d="M 40 260 L 40 280 L 60 280" />
    <path d="M 1160 260 L 1160 280 L 1140 280" />
  </g>
</svg>