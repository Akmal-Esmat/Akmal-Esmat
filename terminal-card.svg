<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="0" y="0" width="900" height="260" rx="10" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="36" rx="10" fill="#21262d"/>
  <rect x="0" y="26" width="900" height="10" fill="#21262d"/>

  <!-- Window buttons -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>

  <!-- Window title -->
  <text x="450" y="22" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">dev@workstation: ~</text>

  <!-- Terminal content -->
  <text x="24" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="15" fill="#7ee787">
    <tspan x="24" dy="0">$ whoami</tspan>
    <tspan x="24" dy="26" fill="#79c0ff" font-weight="600">systems-engineer</tspan>
    <tspan x="24" dy="26" fill="#7ee787">$ cat /etc/education</tspan>
    <tspan x="24" dy="26" fill="#79c0ff">Computer &amp; Communication Engineering — Cairo University</tspan>
    <tspan x="24" dy="26" fill="#7ee787">$ ps aux | grep current_focus</tspan>
    <tspan x="24" dy="26" fill="#ffa657">backend         RUNNING  — distributed services &amp; APIs</tspan>
    <tspan x="24" dy="26" fill="#ffa657">infrastructure  RUNNING  — container orchestration &amp; IaC</tspan>
    <tspan x="24" dy="26" fill="#ffa657">systems         RUNNING  — low-level design &amp; scheduling</tspan>
    <tspan x="24" dy="26" fill="#ffa657">security        RUNNING  — defense-in-depth architecture</tspan>
  </text>

  <!-- Cursor blink -->
  <rect x="24" y="238" width="10" height="18" fill="#7ee787" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent -->
  <rect x="0" y="256" width="900" height="4" rx="0" fill="#00d26a" opacity="0.6"/>
</svg>